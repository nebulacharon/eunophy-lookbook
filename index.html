<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunophy — Lookbook & Curations</title>
  
  <!-- Font Serif Editorial (Playfair Display / Cormorant Garamond) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR TETAP -->
  <header>
    <div class="brand-title">EUNOPHY</div>
    <div class="search-box">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="search-input" class="search-input" placeholder="Cari koleksi...">
    </div>
  </header>

  <!-- HERO EDITORIAL LAYER -->
  <section class="hero-section">
    <!-- Gambar 1: Background Decorative Illustration -->
    <img src="assets/images/hero-bg.png" class="hero-bg-art" alt="Decorative background" loading="eager">
    
    <!-- Gambar 2: Floating Fashion Illustration -->
    <img src="assets/images/hero-floating.png" class="hero-floating-art" alt="Fashion illustration" loading="eager">

    <!-- Hero Typography -->
    <div class="hero-content">
      <h1 class="hero-title">Wear what makes you<br>feel like yourself</h1>
    </div>
  </section>

  <!-- PRODUCT GRID TETAP -->
  <main>
    <div id="grid-container" class="lookbook-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 50px 0; color: #a3a3a3;">
        Memuat koleksi...
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
