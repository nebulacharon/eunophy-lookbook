<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunophy — Lookbook & Curations</title>
  
  <!-- Font Serif Editorial (Playfair Display / Cormorant Garamond) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- HEADER STICKY -->
<header>
  <div class="header-container">
    <div class="brand-title">EUNOPHY</div>
    <div class="search-box">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="search-input" class="search-input" placeholder="Cari koleksi...">
    </div>
  </div>
</header>

  <!-- HERO EDITORIAL SECTION -->
  <!-- HERO EDITORIAL SECTION -->
  <section class="hero-section">
    <div class="hero-wrapper">
      
      <!-- Layer 1: Partikel Kelopak Belakang (Behind Text & Art) -->
      <div class="petals-container layer-back" aria-hidden="true">
        <span class="petal p1"></span>
        <span class="petal p2"></span>
        <span class="petal p3"></span>
        <span class="petal p4"></span>
        <span class="petal p5"></span>
      </div>

      <!-- Typography Hero (z-index: 2) -->
      <div class="hero-content">
        <h1 class="hero-title">Wear what makes you<br>feel like yourself</h1>
      </div>

      <!-- Floating Illustration (z-index: 2) -->
      <img src="assets/images/hero-floating.png" class="hero-floating-art" alt="Eunophy editorial illustration" loading="eager">

      <!-- Layer 2: Partikel Kelopak Depan (In Front with Depth of Field) -->
      <div class="petals-container layer-front" aria-hidden="true">
        <span class="petal p6"></span>
        <span class="petal p7"></span>
        <span class="petal p8"></span>
        <span class="petal p9"></span>
      </div>

    </div>
  </section>

  <!-- PRODUCT GRID TETAP -->
  <main>
    <div id="grid-container" class="lookbook-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 50px 0; color: #a3a3a3;">
        Memuat koleksi...
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
