<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunophy — Lookbook & Curations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="brand-title">EUNOPHY</div>
    <div class="search-box">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="search-input" class="search-input" placeholder="Cari koleksi...">
    </div>
  </header>

  <main>
    <div id="grid-container" class="lookbook-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 50px 0; color: #a3a3a3;">
        Memuat koleksi...
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
